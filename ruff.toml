line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Textual declares BINDINGS, CSS_PATH and the like as plain class attributes.
    "RUF012",
    # The "distribution family, then the binary available" condition reads better nested.
    "SIM102",
]
